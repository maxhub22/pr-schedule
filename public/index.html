<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางงานทีมสื่อ PR SYSI</title>
<meta name="theme-color" content="#f5f7fa">
<script>try{var t=localStorage.getItem("pr-theme");if(t){document.documentElement.dataset.theme=t;if(t==="dark"){var m=document.querySelector("meta[name=theme-color]");if(m)m.content="#0f141b"}}}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f7fa;--card:#fff;--fg:#18212f;--mut:#637086;--line:#e3e8ef;--acc:#2f78c4;--onacc:#fff;--late:#d13b3b;--soon:#b86a00;--ok:#1f9d6b;--r:14px;--sh:0 1px 2px rgba(20,30,50,.05),0 10px 28px rgba(20,30,50,.06)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f141b;--card:#171e28;--fg:#e8edf5;--mut:#95a1b5;--line:#293241;--acc:#6aa7e6;--onacc:#0b1a2b;--late:#f28b8b;--soon:#e8a94d;--ok:#4cc79a;--sh:0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 'Noto Sans Thai',system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
h1{font-size:18px;line-height:1.35;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:12.5px}
a{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;max-width:100%}
button{cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
button.sm,input.sm{min-height:32px;padding:2px 10px;font-size:13px}
input[type=color]{width:42px;padding:3px}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--acc)}
input:disabled,select:disabled,textarea:disabled{opacity:.75}
.hide{display:none!important}
/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.actions>button,.lmenu summary{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;min-height:40px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;list-style:none;color:var(--fg)}
.actions>button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.lmenu summary::-webkit-details-marker{display:none}
.lmenu[open] summary{border-color:var(--acc)}
.lmenu{position:relative}
.lpanel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 96px}
/* toolbar */
.toolbar{display:grid;gap:10px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.filters>*{flex:0 0 auto}
#title{font-size:17px;font-weight:700}
.seg{display:inline-flex;background:color-mix(in srgb,var(--fg) 6%,var(--card));border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:34px;padding:4px 12px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(20,30,50,.15)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* list */
#main{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow-x:auto}
.count{padding:10px 16px;border-bottom:1px solid var(--line)}
.donebar{padding:12px 16px;border-top:1px solid var(--line)}
.task{--c:#888;position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 16px 14px 22px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border-bottom:0}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.task:hover{background:color-mix(in srgb,var(--fg) 3%,var(--card))}
.t-title{font-weight:600;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.t-dates{color:var(--mut);font-size:13px;margin-top:4px}
.t-note{color:var(--mut);font-size:13.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.t-foot a{padding:4px 10px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-foot a::before{content:"🔗 "}
.t-foot button.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.t-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.due{font-weight:700;font-size:14px;white-space:nowrap}
.due.late{color:var(--late)}.due.soon{color:var(--soon)}.due.ok{color:var(--mut);font-weight:600}.due.done{color:var(--ok)}
.task.done .t-title{color:var(--mut);text-decoration:line-through}
.task.done{opacity:.8}
.tg{--c:#888;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:99px;padding:0 9px;font-size:12px;white-space:nowrap}
.pill{--c:#888;padding:1px 9px;border-radius:99px;font-size:12px;white-space:nowrap;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.empty{color:var(--mut);padding:36px 16px;text-align:center}
.empty .big{font-size:34px;line-height:1.2;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 4px;font-size:12.5px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
/* table (desktop) */
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:13px}
.dd summary{cursor:pointer;list-style:none;color:var(--acc)}.dd summary::-webkit-details-marker{display:none}
.dd>div{margin-top:2px}
/* panels */
.lk{display:flex;flex-wrap:wrap;gap:6px}
.lkc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 12px}
.lkc a{text-decoration:none}.lkc button{border:0;padding:0 8px;min-height:30px;color:var(--mut);background:none}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.span2{grid-column:span 2}
.stat{background:color-mix(in srgb,var(--fg) 4%,var(--card));border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{font-size:22px;line-height:1.25;display:block}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--acc)}
.dnb{background:color-mix(in srgb,#22a06b 14%,var(--card));border-color:color-mix(in srgb,#22a06b 50%,transparent);color:#1a7f54}
:root[data-theme="dark"] .dnb{color:#6ee7b0}
/* dialogs */
dialog{border:0;border-radius:18px;background:var(--card);color:var(--fg);width:min(540px,94vw);max-height:92vh;padding:18px;box-shadow:var(--sh);overflow:auto}
dialog::backdrop{background:rgba(10,20,35,.5)}
dialog:focus,dialog:focus-visible{outline:none}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label.l{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%}
.full{grid-column:1/-1}
.ck{display:inline-flex;align-items:center;gap:6px;margin:2px 12px 2px 0;min-height:36px}
.sec{margin-bottom:16px}.sr{display:flex;gap:8px;align-items:center;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--late);color:#fff}
/* phone */
@media(max-width:720px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}
  .appbar{position:static}
  .appbar-in{padding:12px 14px 6px}
  .wrap{padding:8px 12px 110px}
  .lbl{display:none}
  .keep .lbl{display:inline}
  .lpanel{position:fixed;left:12px;right:12px;top:auto;width:auto}
  #bAdd{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:58px;height:58px;min-height:58px;border-radius:50%;padding:0;z-index:35;box-shadow:0 8px 22px rgba(30,80,150,.4)}
  #bAdd .ic{font-size:30px;line-height:1}
  #main{border-radius:12px}
  .task{padding:13px 12px 13px 18px;gap:10px}
  .t-right .due{font-size:13px}
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:20px 20px 0 0;max-height:92dvh;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:sheet .22s ease-out}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@keyframes sheet{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1 a.home{color:inherit;text-decoration:none}
h1 a.home:hover{opacity:.8}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <div><h1><a class="home" href="./" onclick="event.preventDefault();goHome()" aria-label="กลับหน้าแรก">🗓️ ตารางงานทีมสื่อ PR SYSI</a></h1><div class="sub"><span id="team"></span><span id="msg"></span></div></div>
  <div class="actions">
    <button id="th" onclick="toggleTheme()" aria-label="สลับโหมดมืด/สว่าง">🌙</button>
    <div id="linksTop"></div>
    <div id="statsTop"></div>
    <button id="bSet" onclick="renderSet();sdlg.showModal()" aria-label="ตั้งค่าตัวเลือก"><span class="ic">⚙</span><span class="lbl">ตั้งค่า</span></button>
    <button onclick="exportCsv()" aria-label="ส่งออก CSV"><span class="ic">⬇</span><span class="lbl">CSV</span></button>
    <button id="bLogin" class="pri keep" onclick="openLogin()"><span class="ic">🔒</span><span class="lbl">ล็อกอิน</span></button>
    <button id="bOut" class="keep" onclick="logout()" style="display:none">ออกจากระบบ</button>
    <button id="bAdd" class="pri" onclick="openForm()" aria-label="เพิ่มงาน"><span class="ic">＋</span><span class="lbl">เพิ่มงาน</span></button>
  </div>
</div></header>
<div class="wrap">
  <section class="toolbar">
    <div id="views" class="row"></div>
    <b id="title"></b>
    <div class="row filters">
      <select id="fSort" onchange="setSort(this.value)" title="เรียงตาม"></select><button id="sortDir" onclick="flipSort()" title="สลับลำดับ" aria-label="สลับลำดับ">↑</button><select id="fWho" onchange="render()" aria-label="กรองตามคน"></select><select id="fDept" onchange="render()" aria-label="กรองตามฝ่าย"></select><select id="fSt" onchange="render()" aria-label="กรองตามสถานะ"></select>
    </div>
  </section>
  <main id="main"><div class="empty">กำลังโหลดตาราง…</div></main>
  <div class="legend" id="legend"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" tabindex="-1" autofocus>
  <b id="dtitle">เพิ่มงาน</b>
  <div class="f" style="margin-top:10px">
    <div class="full"><label class="l">ชื่องาน</label><input id="t" autocomplete="off"></div>
    <div class="full"><label class="l">ผู้รับผิดชอบ (เลือกได้หลายคน = ทำด้วยกัน)</label><div id="whoBox"></div></div>
    <div class="full"><label class="l">ประเภทงาน (เลือกได้หลายอย่าง)</label><div id="typeBox"></div></div>
    <div class="full"><label class="l">ทำให้ฝ่าย</label><select id="dept"></select></div>
    <div><label class="l">วันเริ่มงาน</label><input type="date" id="s"></div>
    <div><label class="l">วันเสร็จ (กำหนดส่ง)</label><input type="date" id="e"></div>
    <div><label class="l">สถานะ</label><select id="st"></select></div>
    <div><label class="l">ความสำคัญ</label><select id="pri"></select></div>
    <div class="full"><label class="l">ลิงก์ไฟล์ / โฟลเดอร์งาน (เพิ่มได้หลายอัน)</label><div id="lkRows"></div><button onclick="addLkRow()" style="margin-top:4px">+ เพิ่มลิงก์</button></div>
    <div class="full"><label class="l">หมายเหตุ / บรีฟ</label><textarea id="note" rows="2" autocomplete="off"></textarea></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px">
    <button id="del" onclick="delTask()" style="color:#ef4444">ลบ</button>
    <span><button onclick="dlg.close()">ยกเลิก</button> <button class="pri" onclick="saveTask()">บันทึก</button></span>
  </div>
</dialog>

<dialog id="ldlg">
  <b>ล็อกอินเพื่อแก้ไข</b><div class="sub">ใส่รหัสผ่านของทีม (ไม่ล็อกอินก็ดูตารางได้ตามปกติ)</div>
  <div class="f" style="margin-top:10px">
    <div class="full" id="lbody"></div>
  </div>
  <div class="sub" id="lerr" style="color:#ef4444;margin-top:8px;min-height:18px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button onclick="ldlg.close()">ยกเลิก</button><button class="pri" onclick="doLogin()">ล็อกอิน</button></div>
</dialog>

<dialog id="sdlg">
  <b>ตั้งค่าตัวเลือก</b><div class="sub" style="margin-bottom:10px">เพิ่มตัวเลือกใหม่และเลือกสีได้ ใช้ร่วมกันทั้งทีม</div>
  <div id="sbody"></div><div class="sub" id="smsg" style="color:#ef4444;margin-bottom:8px"></div>
  <div style="text-align:right"><button class="pri" onclick="sdlg.close()">เสร็จสิ้น</button></div>
</dialog>
<script>
const ST=['รอเริ่ม','กำลังทำ','รอตรวจ/แก้ไข','เสร็จแล้ว','เลื่อน/ยกเลิก'],PRI=['ปกติ','ด่วน'];
const DEFC={who:[{n:'แก่น',c:'#4a8fd4'},{n:'แม็ก',c:'#22a06b'}],types:[{n:'วิดีโอ',c:'#ef4444'},{n:'กราฟฟิก',c:'#8b5cf6'}],depts:[{n:'Incubation Program',c:'#7c5cff'},{n:'Connect.SYSI',c:'#0ea5a4'},{n:'SYSI School',c:'#f59e0b'},{n:'PR',c:'#ec4899'}],links:[],stc:{},pcc:{}};
const NM={who:'ผู้รับผิดชอบ',types:'ประเภทงาน',depts:'ทำให้ฝ่าย'};
const DAYS=['อา','จ','อ','พ','พฤ','ศ','ส'],MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const VIEWS=[['list','รายการ'],['day','รายวัน'],['week','รายสัปดาห์'],['month','รายเดือน']];
let cfg=JSON.parse(JSON.stringify(DEFC)),tasks=[],view='list',sty='card',per='all',cur=new Date(),editId=null;
const $=id=>document.getElementById(id);
const S=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=s=>new Date(s+'T00:00:00');
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=v=>Array.isArray(v)?v:(v?String(v).split(','):[]);
const cc=(k,n)=>(cfg[k].find(x=>x.n===n)||{c:'#888'}).c;
const tag=(k,n)=>`<span class="tg" style="--c:${cc(k,n)}">${esc(n)}</span>`;
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
const today=()=>S(new Date());
const opts=(a,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option>${esc(x)}</option>`).join('');
const ck=(g,l)=>l.map(x=>`<label class="ck"><input type="checkbox" name="${g}" value="${esc(x.n)}">${esc(x.n)}</label>`).join('');
const SC={'รอเริ่ม':'#64748b','กำลังทำ':'#3b82f6','รอตรวจ/แก้ไข':'#f59e0b','เสร็จแล้ว':'#22a06b','เลื่อน/ยกเลิก':'#ef4444'},PC={'ปกติ':'#64748b','ด่วน':'#ef4444'};
const STI=ST.map(n=>({n,c:SC[n]})),PRI_I=PRI.map(n=>({n,c:PC[n]}));
const sp=s=>`<span class="pill" style="--c:${SC[s]||'#888'}">${esc(s)}</span>`;
const copts=(a,all,sel)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option value="${esc(x.n)}" style="color:${x.c};font-weight:600" ${x.n===sel?'selected':''}>● ${esc(x.n)}</option>`).join('');
function paint(el){const o=el.options[el.selectedIndex];el.style.color=o&&o.style.color?o.style.color:'';el.style.borderColor=o&&o.style.color?o.style.color:''}
// ปรับความกว้างช่องเลือกในแถบเครื่องมือให้พอดีกับข้อความที่เลือกอยู่
let _cv=null;try{_cv=document.createElement('canvas').getContext('2d')}catch(e){}
function fit(el){
  const o=el.options[el.selectedIndex],t=o?o.text:'',cs=getComputedStyle(el);
  let w;
  if(_cv){_cv.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;w=_cv.measureText(t).width}else w=t.length*9;
  el.style.width=Math.ceil(w+(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0)+32)+'px';
}
const fitAll=()=>document.querySelectorAll('.filters select,#views select').forEach(fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitAll());
const paintAll=()=>{document.querySelectorAll('select').forEach(paint);fitAll()};
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'){paint(e.target);if(e.target.closest('.filters,#views'))fit(e.target)}});
const getLinks=t=>Array.isArray(t.links)?t.links:(t.link?[{l:'ลิงก์',u:t.link}]:[]);
const sn=l=>{l=l||'ลิงก์';return l.length>6?l.slice(0,6)+'…':l};
const la=(x,short)=>`<a href="${esc(safe(x.u))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${esc(x.l||'ลิงก์')}" style="color:var(--acc)">${esc(short?sn(x.l):(x.l||'ลิงก์'))}</a>`;
function lks(t){const L=getLinks(t);if(!L.length)return '<span class="sub">–</span>';
  if(L.length===1)return '🔗 '+la(L[0],1)+(L[0].l&&L[0].l.length>6?'':' <span class="sub">…</span>');
  return `<details class="dd" onclick="event.stopPropagation()"><summary>🔗 ${esc(sn(L[0].l))}${(L[0].l||'ลิงก์').length>6?'':' …'} <span class="sub">(${L.length})</span></summary>${L.map(x=>`<div>🔗 ${la(x)}</div>`).join('')}</details>`}
const syncC=()=>{STI.forEach(x=>x.c=SC[x.n]);PRI_I.forEach(x=>x.c=PC[x.n])};

}
function tbl(r){
  return `<table><tr><th>งาน</th><th>ผู้ทำ</th><th>ประเภท</th><th>ฝ่าย</th><th>เริ่ม</th><th>เสร็จ</th><th>สถานะ</th><th>ลิงก์</th></tr>`+r.map(t=>`<tr><td>${t.pri==='ด่วน'?'🔥 ':''}<a href="#" onclick="openForm('${t.id}');return false" style="color:var(--acc)">${esc(t.t)}</a></td><td>${arr(t.who).map(n=>tag('who',n)).join(' ')}</td><td>${arr(t.type).map(n=>tag('types',n)).join(' ')}</td><td>${tag('depts',t.dept)}</td><td>${t.s}</td><td ${late(t)?'style="color:#ef4444"':''}>${t.e}</td>
    <td>${canEdit?`<select onchange="setSt('${t.id}',this.value)">${copts(STI,'',t.st)}</select>`:sp(t.st)}</td><td>${lks(t)}</td></tr>`).join('')+'</table>'}
function nav(n){
  if(per==='custom'){const r=range();if(!r)return;const a=new Date(r[0]+'T00:00:00'),len=Math.round((new Date(r[1]+'T00:00:00')-a)/864e5)+1;rf=S(add(a,n*len));rt=S(add(a,n*len+len-1))}
  else if(per==='day')cur=add(cur,n);else if(per==='week')cur=add(cur,7*n);else if(per==='year')cur=new Date(cur.getFullYear()+n,0,1);else cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);
  render()}
function setSt(id,st){const t=tasks.find(x=>x.id===id);if(t)put({...t,st})}

// ---------- settings ----------
function renderSet(){
  $('sbody').innerHTML=Object.keys(NM).map(k=>`<div class="sec"><b>${NM[k]}</b>${cfg[k].map((x,i)=>`<div class="sr"><input type="color" value="${x.c}" oninput="liveC('${k}',${i},this.value)" onchange="setC('${k}',${i},this.value)"><input autocomplete="off" value="${esc(x.n)}" style="flex:1;min-width:0" onchange="renO('${k}',${i},this.value)" title="แก้ชื่อได้ (งานเดิมจะเปลี่ยนชื่อตามให้)"><button onclick="rmO('${k}',${i})">ลบ</button></div>`).join('')}
  <div class="sr"><input type="color" id="c_${k}" value="#4a8fd4"><input id="n_${k}" autocomplete="off" placeholder="เพิ่มตัวเลือกใหม่" style="flex:1"><button class="pri" onclick="addO('${k}')">เพิ่ม</button></div></div>`).join('')+extraSet()+'<div class="sub">การลบตัวเลือกจะไม่ลบงานเดิมที่เคยเลือกไว้</div>';
}
function extraSet(){
 return `<div class="sec"><b>สีสถานะ / ความสำคัญ</b>${ST.map(n=>`<div class="sr"><input type="color" value="${SC[n]}" oninput="liveSC(0,'${n}',this.value)" onchange="setSC(0,'${n}',this.value)"><span>${n}</span></div>`).join('')}${PRI.map(n=>`<div class="sr"><input type="color" value="${PC[n]}" oninput="liveSC(1,'${n}',this.value)" onchange="setSC(1,'${n}',this.value)"><span>ความสำคัญ: ${n}</span></div>`).join('')}</div>`}
function liveSC(k,n,c){(k?PC:SC)[n]=c;(k?cfg.pcc:cfg.stc)[n]=c;syncC();fill();render()}
function setSC(k,n,c){liveSC(k,n,c);saveCfg(false)}
function liveC(k,i,c){cfg[k][i].c=c;fill();render()}
function setC(k,i,c){cfg[k][i].c=c;saveCfg(false)}
function renO(k,i,v){
  v=v.trim();const old=cfg[k][i].n;
  if(!v||v===old){renderSet();return}
  if(cfg[k].some((x,j)=>j!==i&&x.n===v)){$('smsg').textContent='มีชื่อนี้อยู่แล้ว';renderSet();return}
  $('smsg').textContent='';
  cfg[k]=cfg[k].map((x,j)=>j===i?{...x,n:v}:x);
  const f=k==='who'?'who':k==='types'?'type':'dept',ch=[];
  tasks=tasks.map(t=>{
    if(f==='dept'){if(t.dept!==old)return t;const n={...t,dept:v};ch.push(n);return n}
    const a=arr(t[f]);if(!a.includes(old))return t;const n={...t,[f]:a.map(x=>x===old?v:x)};ch.push(n);return n});
  ch.forEach(t=>{api('/api/task',{method:'POST',body:JSON.stringify(t)}).catch(()=>{$('smsg').textContent='บันทึกงานบางรายการไม่ได้'})});
  saveCfg();
}
function rmO(k,i){cfg[k]=cfg[k].filter((_,j)=>j!==i);saveCfg()}
function addO(k){const n=$('n_'+k).value.trim();if(!n||cfg[k].some(x=>x.n===n))return;cfg[k]=[...cfg[k],{n,c:$('c_'+k).value}];saveCfg()}

// ---------- form ----------
function openForm(id,day){
  if(!canEdit&&!id){openLogin();return}
  editId=id;const t=id?tasks.find(x=>x.id===id):null;
  $('dtitle').textContent=t?'แก้ไขงาน':'เพิ่มงาน';$('del').style.display=t?'':'none';
  const d=day||S(cur),w=t?arr(t.who):[cfg.who[0]?.n],ty=t?arr(t.type):[cfg.types[0]?.n];
  $('t').value=t?.t||'';$('dept').value=t?.dept||cfg.depts[0]?.n||'';
  document.querySelectorAll('[name=who]').forEach(c=>c.checked=w.includes(c.value));
  document.querySelectorAll('[name=type]').forEach(c=>c.checked=ty.includes(c.value));
  $('s').value=t?.s||d;$('e').value=t?.e||d;$('st').value=t?.st||ST[0];$('pri').value=t?.pri||PRI[0];$('lkRows').innerHTML='';(t?getLinks(t):[]).forEach(x=>addLkRow(x));if(!t)addLkRow();$('note').value=t?.note||'';
  document.querySelectorAll('#dlg input,#dlg select,#dlg textarea').forEach(e=>e.disabled=!canEdit);
  $('dtitle').textContent=canEdit?(t?'แก้ไขงาน':'เพิ่มงาน'):'รายละเอียดงาน';
  if(!canEdit)$('lkRows').innerHTML=(t?getLinks(t):[]).map(x=>'🔗 '+la(x)).join('<br>')||'<span class="sub">–</span>';
  $('del').style.display=canEdit&&t?'':'none';
  document.querySelector('#dlg .pri').style.display=canEdit?'':'none';
  document.querySelector('#dlg [onclick="addLkRow()"]').style.display=canEdit?'':'none';
  document.querySelector('#dlg [onclick="dlg.close()"]').textContent=canEdit?'ยกเลิก':'ปิด';
  resetDel();$('dlg').showModal();try{document.activeElement.blur();$('dlg').focus({preventScroll:true})}catch(e){}paintAll();
}
const checked=n=>[...document.querySelectorAll(`[name=${n}]:checked`)].map(c=>c.value);
function addLkRow(x){const d=document.createElement('div');d.className='sr';
  d.innerHTML='<input class="lkn" autocomplete="off" placeholder="ชื่อลิงก์" style="width:32%"><input class="lku" autocomplete="off" placeholder="https://..." style="flex:1;min-width:0;width:auto"><button onclick="this.parentNode.remove()">✕</button>';
  d.querySelector('.lkn').value=x?.l||'';d.querySelector('.lku').value=x?.u||'';$('lkRows').appendChild(d)}
function readLinks(){return [...document.querySelectorAll('#lkRows .sr')].map(r=>({l:r.querySelector('.lkn').value.trim()||'ลิงก์',u:r.querySelector('.lku').value.trim()})).filter(x=>/^https?:\/\//i.test(x.u))}
function saveTask(){
  if(!$('t').value.trim()){$('t').focus();return}
  const s=$('s').value;let e=$('e').value;if(!s)return;if(!e||e<s)e=s;
  put({id:editId||'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:$('t').value.trim(),who:checked('who'),type:checked('type'),dept:$('dept').value,s,e,st:$('st').value,pri:$('pri').value,cre:(tasks.find(x=>x.id===editId)||{}).cre||Date.now(),links:readLinks(),note:$('note').value.trim()});
  $('dlg').close();
}
let delArm=null;
function resetDel(){clearTimeout(delArm);delArm=null;$('del').textContent='ลบ'}
async function delTask(){
  if(!delArm){$('del').textContent='กดอีกครั้งเพื่อยืนยันลบ';delArm=setTimeout(resetDel,4000);return}
  const id=editId;resetDel();
  try{
    await api('/api/task?id='+encodeURIComponent(id),{method:'DELETE'});tasks=tasks.filter(x=>x.id!==id);render();toast('ลบงานแล้ว');
    $('dlg').close();
  }catch(e){if(e.status===401){setMe(null);$('dlg').close();openLogin();return}$('del').textContent='ลบไม่ได้: '+e.message;delArm=setTimeout(resetDel,4000)}
}
function exportCsv(){
  const head=['งาน','ผู้ทำ','ประเภท','ฝ่าย','เริ่ม','เสร็จ','สถานะ','ความสำคัญ','ลิงก์','หมายเหตุ'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\ufeff'+[head,...tasks.map(t=>[t.t,arr(t.who).join('+'),arr(t.type).join('+'),t.dept,t.s,t.e,t.st,t.pri,getLinks(t).map(x=>x.l+': '+x.u).join(' | '),t.note])].map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='pr-schedule.csv';
  document.body.appendChild(a);a.click();a.remove();
}

// ---------- init ----------
let th='light';try{th=localStorage.getItem('pr-theme')||'light'}catch(e){}
let savedTh='light';try{savedTh=localStorage.getItem('pr-theme')||'light'}catch(e){}
setTheme(savedTh);$('st').innerHTML=copts(STI);$('pri').innerHTML=copts(PRI_I);
$('fSort').innerHTML=SORTS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
fill();render();initStore();
</script>
</body>
